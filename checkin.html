<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Check-in – 60 năm ĐKT</title><link rel="stylesheet" href="style.css">
<style>
body{background:#eef6fa}
.ck{max-width:560px;margin:0 auto;padding:1rem}
.ck h1{color:var(--royal);font-size:1.4rem;margin:.2rem 0}
.box{background:#fff;border:1.5px solid var(--gold-l);border-radius:12px;padding:1rem;margin:.8rem 0}
video{width:100%;border-radius:10px;background:#000;max-height:42vh;object-fit:cover;display:none}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}.row>*{flex:1;min-width:120px}
.banner{padding:.7rem 1rem;border-radius:10px;font-weight:700;margin:.6rem 0}
.banner.ok{background:#e8f7e8;border:2px solid #3a8a3a}.banner.warn{background:#fff3d6;border:2px solid #e0a000}.banner.bad{background:#fde7e7;border:2px solid #b3261e}
.big{font-size:1.25rem;font-weight:800;color:var(--navy)}
.kv{font-size:.92rem;color:#445}.kv b{color:var(--ink)}
.cnt{display:flex;align-items:center;gap:.6rem}.cnt button{width:48px;height:48px;font-size:1.6rem;border-radius:10px;border:1.5px solid var(--navy);background:#fff}
.cnt input{text-align:center;font-size:1.5rem;font-weight:800;width:90px;flex:none}
.btn.full{width:100%;margin:.4rem 0;border-radius:12px}.btn.sec{background:#fff;border:2px solid var(--navy);color:var(--navy)}
.hit{padding:.6rem;border-bottom:1px solid #ddd;cursor:pointer}.hit:hover{background:#fff8e8}
.stats{display:flex;gap:.5rem;flex-wrap:wrap}.stats div{flex:1;min-width:110px;text-align:center;background:var(--sand);border-radius:10px;padding:.4rem}
.stats b{display:block;font-size:1.4rem;color:var(--navy)}
</style></head>
<body><div class="ck">
<h1>✅ Check-in đại biểu – 60 năm ĐKT</h1>

<div class="box" id="login">
  <label>Mã PIN nhân viên<input type="password" id="pin" autocomplete="off" inputmode="text"></label>
  <button class="btn full" id="pinGo">Vào hệ thống</button>
  <p id="pinErr" class="err"></p>
</div>

<div id="main" hidden>
  <div class="box"><div class="stats" id="stats">Đang tải thống kê…</div></div>

  <div class="box">
    <button class="btn full" id="cam">📷 Quét QR trên vé</button>
    <video id="v" playsinline muted></video>
    <div class="row"><input id="q" placeholder="Tìm theo tên / SĐT / mã (khi mất vé)"><button class="btn sec" id="qGo">Tìm</button></div>
    <div id="hits"></div>
  </div>

  <div class="box" id="card" hidden>
    <div id="banner"></div>
    <div class="kv" id="meta"></div>
    <label>Họ và tên<input id="f_hoTen"></label>
    <label>Chức danh<input id="f_chucDanh"></label>
    <label>Đơn vị<input id="f_donVi"></label>
    <label>Số điện thoại<input id="f_sdt" type="tel"></label>
    <label>Ăn uống / ghi chú tiệc<input id="f_anUong"></label>
    <label>Số người thực tế tham dự (tính cả đại biểu)
      <div class="cnt"><button type="button" id="minus">−</button><input id="f_so" type="number" min="0" max="50"><button type="button" id="plus">+</button></div>
    </label>
    <label>Ghi chú check-in<input id="f_ghiChu" maxlength="300"></label>
    <button class="btn full" id="save">Cập nhật & Check-in</button>
    <button class="btn full sec" id="next">Quét người tiếp theo</button>
    <p id="saveErr" class="err"></p>
  </div>
  <p><a href="index.html">← Trang thư mời</a> · <a href="#" id="logout">Đăng xuất</a></p>
</div>
</div>

<script src="vendor/jsQR.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s), EP = window.CONFIG.endpoint;
const CODE_RE = /^DKT60-[A-Z2-9]{6}$/;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pin = localStorage.getItem("dkt60_pin") || "", cur = null, busy = false;

async function api(params) {
  if (!EP) throw new Error("Chưa cấu hình endpoint trong config.js");
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(EP + "?" + new URLSearchParams({ ...params, pin }), { signal: ctl.signal });
    return await r.json();
  } catch (e) { return { ok: false, error: e.name === "AbortError" ? "Hết thời gian chờ – kiểm tra mạng" : "Lỗi kết nối: " + e.message }; }
  finally { clearTimeout(t); }
}

function extractCode(txt) {
  txt = String(txt || "").trim();
  try { const c = new URL(txt).searchParams.get("c"); if (c) txt = c; } catch {}
  txt = txt.toUpperCase();
  return CODE_RE.test(txt) ? txt : "";
}

/* --- Đăng nhập PIN --- */
async function enter() {
  $("#pinErr").textContent = "";
  const r = await api({ action: "stats" });
  if (!r.ok) { $("#pinErr").textContent = r.error === "PIN" ? "Sai PIN (hoặc chưa đặt PIN trong Apps Script)." : r.error; return false; }
  localStorage.setItem("dkt60_pin", pin);
  $("#login").hidden = true; $("#main").hidden = false; showStats(r);
  const c = extractCode(new URLSearchParams(location.search).get("c"));
  if (c) lookup(c);
  return true;
}
$("#pinGo").onclick = () => { pin = $("#pin").value.trim(); enter(); };
$("#pin").onkeydown = e => { if (e.key === "Enter") $("#pinGo").click(); };
$("#logout").onclick = e => { e.preventDefault(); localStorage.removeItem("dkt60_pin"); location.href = "checkin.html"; };
function showStats(r) {
  $("#stats").innerHTML = `<div><b>${r.daCheckIn}</b>Đã check-in</div><div><b>${r.dangKyCoMat}</b>ĐK tham dự</div>` +
    `<div><b>${r.tongNguoiThucTe}</b>Người có mặt</div><div><b>${r.tongNguoiDuKien}</b>Người dự kiến</div>`;
}
async function refreshStats() { const r = await api({ action: "stats" }); if (r.ok) showStats(r); }

/* --- Tra cứu & hiển thị --- */
async function lookup(code) {
  stopCam(); $("#hits").innerHTML = "";
  setBanner("warn", "Đang tra cứu " + esc(code) + "…"); $("#card").hidden = false;
  const r = await api({ action: "lookup", code });
  if (!r.ok) { setBanner("bad", "❌ " + esc(r.error)); fillForm(null); return; }
  fillForm(r.rec);
}
function setBanner(cls, html) { $("#banner").innerHTML = `<div class="banner ${cls}">${html}</div>`; }
function fillForm(rec) {
  cur = rec; $("#saveErr").textContent = "";
  $("#save").disabled = $("#next").disabled = false;
  $("#card").querySelectorAll("input,button#save").forEach(el => el.disabled = !rec && el.id !== "");
  if (!rec) { $("#meta").innerHTML = ""; return; }
  $("#card").querySelectorAll("input,button").forEach(el => el.disabled = false);
  for (const k of ["hoTen","chucDanh","donVi","sdt","anUong"]) $("#f_" + k).value = rec[k] ?? "";
  $("#f_so").value = rec.soNguoiThucTe ?? (rec.thamDu === "Không" ? 1 : 1 + rec.nguoiDiCung);
  $("#f_ghiChu").value = rec.ghiChuCheckIn || "";
  $("#meta").innerHTML = `<p class="big">${esc(rec.maDangKy)}</p><p>Nhóm: <b>${esc(rec.nhom)}</b> · Đăng ký: <b>${esc(rec.thamDu)}</b> · Đi cùng đăng ký: <b>${rec.nguoiDiCung}</b><br>Nội dung: ${esc(rec.noiDung || "—")}<br>Tham luận: ${esc(rec.thamLuan || "—")}</p>`;
  if (rec.checkIn) { setBanner("warn", `⚠ ĐÃ check-in lúc ${esc(rec.thoiGianCheckIn)} (${rec.soNguoiThucTe ?? "?"} người). Bấm "Cập nhật" nếu muốn sửa lại.`); $("#save").textContent = "Cập nhật lại thông tin"; }
  else if (rec.thamDu !== "Có") { setBanner("warn", "⚠ Đại biểu này đăng ký KHÔNG tham dự – vẫn có thể check-in nếu có mặt."); $("#save").textContent = "Cập nhật & Check-in"; }
  else { setBanner("ok", "✅ Đăng ký hợp lệ – kiểm tra thông tin rồi bấm Cập nhật."); $("#save").textContent = "Cập nhật & Check-in"; }
}
$("#minus").onclick = () => $("#f_so").value = Math.max(0, (+$("#f_so").value || 0) - 1);
$("#plus").onclick = () => $("#f_so").value = Math.min(50, (+$("#f_so").value || 0) + 1);

/* --- Cập nhật = tick check-in vào Google Sheet --- */
$("#save").onclick = async () => {
  if (!cur || busy) return;
  const so = Number($("#f_so").value);
  if (!Number.isInteger(so) || so < 0 || so > 50) { $("#saveErr").textContent = "Số người phải là số nguyên từ 0 đến 50."; return; }
  busy = true; $("#save").disabled = true; $("#save").textContent = "Đang cập nhật…"; $("#saveErr").textContent = "";
  const r = await api({
    action: "checkin", code: cur.maDangKy, force: cur.checkIn ? "1" : "0", soNguoi: so,
    hoTen: $("#f_hoTen").value.trim(), chucDanh: $("#f_chucDanh").value.trim(), donVi: $("#f_donVi").value.trim(),
    sdt: $("#f_sdt").value.trim(), anUong: $("#f_anUong").value.trim(), ghiChu: $("#f_ghiChu").value.trim()
  });
  busy = false; $("#save").disabled = false;
  if (!r.ok) { $("#saveErr").textContent = "❌ " + (r.error || "Không cập nhật được – thử lại"); $("#save").textContent = "Thử lại"; return; }
  cur = r.rec;
  setBanner("ok", `✅ Đã CHECK-IN: <b>${esc(cur.hoTen)}</b> – ${cur.soNguoiThucTe} người (${esc(cur.thoiGianCheckIn)})`);
  $("#save").textContent = "Cập nhật lại thông tin"; refreshStats();
  if (navigator.vibrate) navigator.vibrate(150);
};
$("#next").onclick = () => { $("#card").hidden = true; cur = null; startCam(); };

/* --- Tìm thủ công (mất vé) --- */
$("#qGo").onclick = async () => {
  const q = $("#q").value.trim(); if (q.length < 2) return;
  $("#hits").textContent = "Đang tìm…";
  const r = await api({ action: "search", q });
  if (!r.ok) { $("#hits").textContent = "❌ " + r.error; return; }
  $("#hits").innerHTML = r.list.length ? r.list.map(x =>
    `<div class="hit" data-c="${esc(x.maDangKy)}"><b>${esc(x.hoTen)}</b> – ${esc(x.donVi)}<br><small>${esc(x.sdt)} · ${esc(x.maDangKy)} ${x.checkIn ? "· ✅ đã check-in" : ""}</small></div>`).join("") : "Không có kết quả.";
};
$("#q").onkeydown = e => { if (e.key === "Enter") $("#qGo").click(); };
$("#hits").onclick = e => { const h = e.target.closest(".hit"); if (h) lookup(h.dataset.c); };

/* --- Camera quét QR (jsQR – chạy cả iPhone & Android) --- */
let stream = null;
async function startCam() {
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); }
  catch { alert("Không mở được camera. Cần HTTPS và cho phép quyền camera."); return; }
  const v = $("#v"); v.style.display = "block"; v.srcObject = stream; await v.play();
  const cv = document.createElement("canvas"), g = cv.getContext("2d", { willReadFrequently: true });
  (function loop() {
    if (!stream) return;
    if (v.videoWidth) {
      cv.width = v.videoWidth; cv.height = v.videoHeight; g.drawImage(v, 0, 0);
      const im = g.getImageData(0, 0, cv.width, cv.height), r = jsQR(im.data, im.width, im.height);
      const c = r && extractCode(r.data);
      if (c) { if (navigator.vibrate) navigator.vibrate(60); lookup(c); return; }
    }
    requestAnimationFrame(loop);
  })();
}
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $("#v").style.display = "none"; }
$("#cam").onclick = startCam;

if (pin) { $("#pin").value = pin; enter().then(ok => { if (!ok) localStorage.removeItem("dkt60_pin"); }); }
</script></body></html>
